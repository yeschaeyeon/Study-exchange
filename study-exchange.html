:root{--bg:#e8ebf1;--s1:#fff;--s2:#f3f5f9;--line:#b9c2d0;--ink:#0b1220;--mut:#4d586b;--acc:#0b1b3a;--acc-ink:#fff;--ok:#157a3c;--up:#c0132a;
--c-m:#1f5eea;--c-k:#d1202f;--c-e:#14903f;--c-s:#e8590c;--c-l:#0a8f86;--c-h:#8a4b1f;--c-r:#7d2ae8;--c-i:#d6247f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Chosun","Apple SD Gothic Neo",serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{display:flex;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#nav{width:92px;flex:none;background:var(--acc);display:flex;flex-direction:column;gap:6px;padding:14px 10px}
#nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:13px 0;border-radius:12px;color:#b4bfd3;font-size:14px;font-weight:700}
#nav button b{font-size:21px;font-weight:400}
#nav button[aria-pressed=true]{background:#fff;color:var(--acc)}
#main{flex:1;min-width:0;display:flex;flex-direction:column;padding:10px 14px 12px}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 4px 8px}
.hd .l{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mut);font-weight:700}
.hd .l button{border:1.5px solid var(--acc);background:var(--s1);border-radius:10px;padding:5px 12px;font-size:15px;color:var(--acc);font-weight:700}
.hd .l .dt{min-width:84px;text-align:center;color:var(--ink)}
.hd .c{text-align:center;line-height:1}
.hd .c b{display:block;font-size:clamp(40px,8vh,76px);font-weight:700;color:var(--acc);letter-spacing:-1px}
.hd .c span{font-size:12px;color:var(--mut)}
.hd .r{text-align:right;font-size:13px;color:var(--mut)}.hd .r b{font-size:20px;color:var(--ink)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.days{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dc{display:flex;flex-direction:column;min-height:0;border:2px solid var(--acc);border-radius:14px;background:var(--s1);overflow:hidden}
.dh{flex:none;display:flex;align-items:baseline;gap:8px;padding:8px 12px;background:var(--acc);color:#fff}
.dh b{font-size:19px}.dh span{font-size:12px;opacity:.85}.dh em{font-style:normal;margin-left:auto;font-size:13px;font-weight:700}
.dh .flag{background:#fff;color:var(--acc);border-radius:5px;font-size:10px;padding:1px 6px;font-weight:700}
.dc.today .dh::after{content:'TODAY';font-size:10px;background:#fff;color:var(--acc);border-radius:5px;padding:1px 6px;font-weight:700;order:-1}
.dbar{flex:none;height:5px;background:#cfd6e2}.dbar i{display:block;height:100%;background:var(--acc)}
.dsc{flex:1;min-height:0;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;background:var(--s2)}
.slot{flex:none;border:1.5px solid var(--ink);border-radius:11px;background:var(--s1);overflow:hidden}
.slot.now{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc)}
.slot.past{opacity:.55}
.slot h4{display:flex;gap:8px;align-items:baseline;padding:4px 10px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:700}.slot h4 small{font-weight:400;font-size:11px;opacity:.85}
.slot .its{display:flex;flex-direction:column;gap:5px;padding:6px}
.fx{flex:none;text-align:center;font-size:11px;color:var(--mut);padding:0}
.it{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:14.5px;line-height:1.32;font-weight:700;color:var(--ink);padding:7px 9px 7px 11px;cursor:pointer;word-break:keep-all;background:var(--s1);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:8px}
.it .ck{flex:none;width:21px;height:21px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.it.done{background:#dfe4ec;color:var(--mut);text-decoration:line-through;border-color:#c3cbd8;border-left-color:var(--c)}
.it.done .ck{background:var(--ink);border-color:var(--ink);color:#fff}.it.done .ck::after{content:'✓'}
.pb{flex:none;display:flex;align-items:center;gap:12px;background:var(--s1);border:1.5px solid var(--acc);border-radius:12px;padding:7px 14px;font-size:14px;font-weight:700}
.bar{height:10px;border-radius:99px;background:#cfd6e2;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.flag{background:var(--acc);color:#fff;border-radius:6px;font-size:10px;padding:1px 6px;font-weight:700}
.wk{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--s1);border:1.5px solid var(--ink);border-radius:12px;padding:5px;overflow:auto;display:flex;flex-direction:column;gap:4px;min-height:0}
.wd.today{box-shadow:0 0 0 3px var(--acc)}.wd.we{background:var(--s2)}
.wd h5{font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:4px;cursor:pointer;padding:2px 3px}.wd h5 small{color:var(--mut);font-weight:400}
.wd .sl{font-size:10px;color:#fff;background:var(--ink);border-radius:5px;padding:1px 6px;align-self:flex-start;margin-top:2px}
.wd .it{font-size:11.5px;padding:4px 6px 4px 7px;gap:4px;border-left-width:5px}.wd .it .ck{width:14px;height:14px;font-size:9px;border-width:1.5px}
.mwrap{flex:1;min-height:0;overflow:auto}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1.5px solid var(--ink);min-width:760px}
.mh{text-align:center;font-size:12px;font-weight:700;background:var(--acc);color:#fff;padding:4px 0}
.mc{display:flex;flex-direction:column;gap:2px;background:var(--s1);border:1px solid var(--line);padding:4px 5px;cursor:pointer;min-height:88px}
.mc.we{background:var(--s2)}.mc.out{opacity:.4}.mc.today{outline:3px solid var(--acc);outline-offset:-3px}.mc.full{background:#d7efdf}
.mc .mt{display:flex;gap:4px;align-items:baseline}.mc .mt i{font-style:normal;font-size:10px;color:var(--mut);margin-left:auto}
.mc .dn{font-size:13px}.dn.sun,.dn.sat{color:var(--up)}.mh.sun,.mh.sat{color:#ffb4bd}
.mc .mcnt{font-size:9px;color:var(--mut)}
.mc .it{font-size:10.5px;padding:0 0 0 4px;gap:3px;border:0;border-left:3px solid var(--c);border-radius:0;background:none;margin-top:1px}.mc .it .ck{display:none}.mc .it.done{background:none}.mc .it.done::before{content:'✓ ';text-decoration:none}
.chips{display:flex;gap:6px;margin-bottom:6px}
.chip{border:1.5px solid var(--acc);background:var(--s1);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--acc)}
.chip[aria-pressed=true]{background:var(--acc);color:#fff}
.pg{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-content:start}
.card{background:var(--s1);border:1.5px solid var(--ink);border-radius:14px;padding:14px}
.card h3{font-size:15px;margin-bottom:10px}
.big{font-size:40px;font-weight:700;color:var(--acc)}
.sb{display:grid;grid-template-columns:76px 1fr 74px;gap:10px;align-items:center;margin:8px 0;font-size:14px;font-weight:700}
.sb .bar i{background:var(--c)}.sb span:first-child{color:var(--c)}.sb span:last-child{text-align:right;color:var(--mut);font-size:13px;font-weight:400}

  let h=hdr(`<button data-a="wk" data-v="-1">◀</button><span class="dt">${keyOf(ws)} ~ ${keyOf(we)}</span><button data-a="wk" data-v="1">▶</button>`)+`<div class="body"><div class="wk">`;
  for(let i=0;i<7;i++){const dd=addD(ws,i),k=keyOf(dd),e=EFF[k],dw=dd.getDay();
    if(!e){h+=`<div class="wd"><h5>${k} (${DOW[dw]})</h5></div>`;continue;}
    let last='',inner=''; e.list.forEach(t=>{const s=e.slot[t.id]; if(s!==last){last=s; const sl=SLOTS.find(x=>x.id===s); inner+=`<div class="sl">${sl.label} ${fmt(sl.s)}</div>`;} inner+=item(t);});
    h+=`<div class="wd ${isToday(k)?'today':''} ${dw===0||dw===6?'we':''}"><h5 data-a="go" data-v="${k}"><b>${k} (${DOW[dw]})</b><small>${doneN(e.list)}/${e.list.length}</small></h5>${inner}</div>`;}
  return h+`</div></div>`;
}
function vMonth(){
  const w0=mon(DAYS[0].date), nW=Math.ceil((mon(DAYS[DAYS.length-1].date)-w0)/864e5/7)+1, per=4, nP=Math.ceil(nW/per);
  if(mp==null) mp=Math.max(0,Math.min(nP-1,Math.floor(Math.round((mon(realToday())-w0)/864e5/7)/per)));
  const ws=addD(w0,mp*per*7), we=addD(ws,Math.min(per,nW-mp*per)*7-1), circ='①②③④⑤⑥⑦⑧⑨';
  let tot=0,dn=0; DAYS.forEach(d=>{if(d.date<ws||d.date>we)return; const l=EFF[d.key].list; tot+=l.length; dn+=doneN(l);});
  let h=hdr(`<span class="dt" style="min-width:0">${keyOf(ws)} ~ ${keyOf(we)}</span>`)+`<div class="body"><div class="chips">${Array.from({length:nP},(_,i)=>`<button class="chip" data-a="mp" data-v="${i}" aria-pressed="${i===mp}">계획표 ${circ[i]}</button>`).join('')}<span style="margin-left:8px;font-size:13px;color:var(--mut);align-self:center">달성 ${tot?Math.round(dn/tot*100):0}% · ${dn}/${tot}</span></div>
  <div class="ml">${Object.keys(SUBJ).map(s=>`<span style="--c:var(--c-${s})"><i></i>${SUBJ[s]}</span>`).join('')}</div><div class="mwrap"><div class="mcal"><div class="mh">월</div><div class="mh">화</div><div class="mh">수</div><div class="mh">목</div><div class="mh">금</div><div class="mh sat">토</div><div class="mh sun">일</div>`;
  for(let i=0;i<per*7;i++){const d=addD(ws,i); if(d>we)break; const k=keyOf(d), e=EFF[k], dow=d.getDay();
    if(!e){h+=`<div class="mc out"><span class="mt"><b class="dn">${k}</b></span></div>`;continue;}
    const dd=doneN(e.list), fl=FLAG[k]||(RESERVE.includes(k)?'예비일':'');
    h+=`<div class="mc ${dow===0||dow===6?'we':''} ${isToday(k)?'today':''} ${e.list.length&&dd===e.list.length?'full':''}" data-a="go" data-v="${k}"><span class="mt"><b class="dn ${dow===0?'sun':dow===6?'sat':''}">${k}</b>${fl?`<span class="flag">${fl}</span>`:''}<i>D-${dday(k)}</i></span><span class="mcnt">${dd}/${e.list.length}</span>${e.list.map(item).join('')}</div>`;}
  return h+`</div></div></div>`;
}
function vProg(){
  const bar=(c,d,t)=>`<div class="sb" style="--c:var(${c})"><span>${''}</span><div class="bar"><i style="width:${t?d/t*100:0}%"></i></div><span>${d}/${t}</span></div>`;
  const E=parseKey(E_KEY), first=ALL.filter(t=>parseKey(kOf(t))<=E), all=ALL;
  const st={}; Object.keys(SUBJ).forEach(s=>st[s]={t:0,d:0,t1:0,d1:0});
  all.forEach(t=>{st[t.subj].t++; if(S.done[t.id]) st[t.subj].d++;});
  first.forEach(t=>{st[t.subj].t1++; if(S.done[t.id]) st[t.subj].d1++;});
  const row=(s,d,t)=>`<div class="sb" style="--c:var(--c-${s})"><span>${SUBJ[s]}</span><div class="bar"><i style="width:${t?d/t*100:0}%"></i></div><span>${d}/${t}</span></div>`;
  const dn=doneN(all), d1=doneN(first), t0=realToday(), ws=mon(t0), wl=[];
  for(let i=0;i<7;i++){const k=keyOf(addD(ws,i)); if(EFF[k]) wl.push(...EFF[k].list);}
  const tk=keyOf(t0), tl=EFF[tk]?EFF[tk].list:[];
  const pc=(d,t)=>t?Math.round(d/t*100):0;
  return hdr('')+`<div class="body"><div class="pg">
  <div class="card"><h3>전체 진행률</h3><div class="big">${pc(dn,all.length)}%</div><div class="bar" style="margin:8px 0"><i style="width:${pc(dn,all.length)}%"></i></div><span style="color:var(--mut);font-size:13px">${dn}/${all.length}</span></div>
  <div class="card"><h3>10/14 1차 마감 (남은 분량 ${first.length-d1}개)</h3><div class="big">${pc(d1,first.length)}%</div><div class="bar" style="margin:8px 0"><i style="width:${pc(d1,first.length)}%"></i></div><span style="color:var(--mut);font-size:13px">${d1}/${first.length}</span></div>
  <div class="card"><h3>오늘</h3><div class="big">${pc(doneN(tl),tl.length)}%</div><div class="bar" style="margin:8px 0"><i style="width:${pc(doneN(tl),tl.length)}%"></i></div><span style="color:var(--mut);font-size:13px">${doneN(tl)}/${tl.length}</span></div>
  <div class="card"><h3>이번 주</h3><div class="big">${pc(doneN(wl),wl.length)}%</div><div class="bar" style="margin:8px 0"><i style="width:${pc(doneN(wl),wl.length)}%"></i></div><span style="color:var(--mut);font-size:13px">${doneN(wl)}/${wl.length}</span></div>
  <div class="card"><h3>과목별 (전체)</h3>${Object.keys(SUBJ).filter(s=>st[s].t).map(s=>row(s,st[s].d,st[s].t)).join('')}</div>
  <div class="card"><h3>과목별 (10/14까지)</h3>${Object.keys(SUBJ).filter(s=>st[s].t1).map(s=>row(s,st[s].d1,st[s].t1)).join('')}</div></div></div>`;
}
const TABS=[['today','오늘','◉'],['week','주간','▦'],['month','월간','▤'],['prog','진행률','％']];
function render(){
  buildEff();

document.addEventListener('click',e=>{
