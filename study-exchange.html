<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Study Exchange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0d1016; --s1:#151a22; --s2:#1d242e; --line:#272f3b; --ink:#eef1f6; --mut:#8c97a7;
  --up:#ff5d6c; --dn:#5b9bff; --acc:#f2cf2a; --acc-ink:#12161c; --ok:#62d38d;
  --c-m:#7ea6ff; --c-k:#ff8f8f; --c-e:#62d38d; --c-s:#ffa866; --c-l:#4fd3c7; --c-h:#d0a898; --c-r:#c994ff; --c-i:#f472b6;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef1f5; --s1:#ffffff; --s2:#e6eaf0; --line:#d6dce5; --ink:#12161c; --mut:#667082;
    --up:#e5384a; --dn:#2563eb; --acc:#ffe14d; --acc-ink:#12161c; --ok:#15803d;
    --c-m:#1d4ed8; --c-k:#b91c1c; --c-e:#15803d; --c-s:#c2560c; --c-l:#0f766e; --c-h:#6b4a3d; --c-r:#7e22ce; --c-i:#be185d;
  }
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.5;word-break:keep-all;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.4}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-family:'Bricolage Grotesque','Noto Sans KR',system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.up{color:var(--up)} .dn{color:var(--dn)} .flat{color:var(--mut)}
.app{max-width:520px;margin:0 auto;padding:0 16px}

.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.01em}
.dday{font-size:12px;font-weight:700;background:var(--acc);color:var(--acc-ink);border-radius:99px;padding:3px 10px}
.warn{background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:8px 12px;font-size:13px;margin:6px 0}

.hero{padding:14px 0 6px}
.hero .lab{font-size:13px;color:var(--mut)}
.hero .big{font-size:46px;font-weight:800;line-height:1.05;margin:2px 0 4px}
.hero .chg{font-size:15px;font-weight:700}
.hero .sub{font-size:12px;color:var(--mut);margin-top:6px}

.breadth{margin:14px 0 4px}
.br{display:grid;grid-template-columns:50px 1fr 62px;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.br:first-child{border-top:0}
.br .tk{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:13px;color:var(--c);display:flex;align-items:center;gap:6px}
.br .tk::before{content:"";width:3px;height:16px;border-radius:2px;background:var(--c)}
.axis{position:relative;height:10px}
.axis::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.axis i{position:absolute;top:0;height:10px;border-radius:3px}
.axis i.u{left:50%;background:var(--up)} .axis i.d{right:50%;background:var(--dn)}
.br .pc{text-align:right;font-size:13px;font-weight:700}

.strip{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0 6px;border:1px solid var(--line);border-radius:14px;background:var(--s1)}
.strip div{padding:10px 6px;text-align:center;border-left:1px solid var(--line)}
.strip div:first-child{border-left:0}
.strip b{display:block;font-size:18px;font-weight:800}
.strip span{font-size:11px;color:var(--mut)}

.cta{display:block;width:100%;background:var(--acc);color:var(--acc-ink);font-weight:900;font-size:16px;border-radius:14px;padding:15px;margin:14px 0 6px;text-align:center}
.cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:700}
.cta.sm{padding:11px;font-size:14px;margin:8px 0 0}
.cta.half{display:inline-block;width:auto;padding:10px 14px;font-size:13px;margin:6px 6px 0 0}
.mini{font-size:12px;color:var(--mut);margin:6px 0}
.err{font-size:13px;color:var(--up);margin:8px 0 0}

h2{font-size:20px;font-weight:900;margin:18px 0 8px;letter-spacing:-.01em}
h3{font-size:14px;font-weight:700;margin:0 0 8px}
.note{font-size:13px;color:var(--mut);margin:0 0 10px}
.box{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.empty{border:1px dashed var(--line);border-radius:14px;padding:20px 14px;text-align:center;color:var(--mut);font-size:14px;margin:12px 0}
.link{font-size:13px;color:var(--mut);text-decoration:underline;padding:6px 0;display:block}

.chips{display:flex;gap:6px;margin:6px 0 4px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--mut);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.chip .bd{display:inline-block;min-width:16px;margin-left:5px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:900;text-align:center;line-height:16px;padding:0 4px}

.mk{display:grid;grid-template-columns:4px 1fr 78px auto;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 0;border-top:1px solid var(--line)}
.mk:first-of-type{border-top:0}
.mk .bar{width:4px;height:36px;border-radius:2px;background:var(--c)}
.mk .nm b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:16px}
.mk .nm span{font-size:12px;color:var(--mut)}
.mk .px{text-align:right}
.mk .px b{display:block;font-size:16px;font-weight:800}
.mk .px span{font-size:12px;font-weight:700}
svg.sp{width:78px;height:30px;overflow:visible}

.back{font-size:14px;color:var(--mut);padding:10px 0}
.dh{display:flex;align-items:baseline;justify-content:space-between}
.dh .t{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;color:var(--c)}
.dh .n{font-size:13px;color:var(--mut)}
.px-big{font-size:40px;font-weight:800;line-height:1.1;margin:6px 0 0}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font-family:'Bricolage Grotesque',sans-serif;font-size:10px;fill:var(--mut)}
svg.ch text.val{fill:var(--ink);font-weight:700}
.rng{display:flex;gap:6px;margin:6px 0}
.fund{width:100%;border-collapse:collapse;font-size:14px}
.fund td{padding:9px 0;border-top:1px solid var(--line)}
.fund tr:first-child td{border-top:0}
.fund td:last-child{text-align:right;font-weight:700}
.why{display:grid;grid-template-columns:78px 1fr 36px;gap:10px;align-items:center;font-size:13px;margin:7px 0;color:var(--mut)}
.why .tr{height:6px;border-radius:99px;background:var(--s2);overflow:hidden}
.why .tr i{display:block;height:100%;background:var(--acc);border-radius:99px}
.why b{color:var(--ink);text-align:right}

.subs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.sb{border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;background:var(--s1)}
.sb b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:14px;color:var(--c)}
.sb span{font-size:12px;color:var(--mut)}
.sb[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:6px 0 10px}
.seg button{border:1px solid var(--line);border-radius:10px;padding:10px 4px;font-size:13px;color:var(--mut);background:var(--s1)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.tasks{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px;max-height:210px;overflow-y:auto}
.tk2{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--s1)}
.tk2[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.tk2.done{opacity:.45;text-decoration:line-through}
.tk2 i{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--c);margin-top:3px}
.tk2.done i{background:var(--c)}
input.txt,input.in,select.in{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:6px 0}
.clock{text-align:center;padding:26px 0 8px}
.clock .ring{position:relative;width:236px;height:236px;margin:0 auto}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.clock .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.clock .t b{font-size:50px;font-weight:800}
.clock .t span{font-size:13px;color:var(--mut)}
.fld{margin:14px 0}
.fld label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.fld label b{font-weight:800}
.fld.off{opacity:.35;pointer-events:none}
input[type=range]{width:100%;accent-color:var(--acc)}
input.nm2{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:18px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.nw{border-top:1px solid var(--line);padding:14px 0}
.nw:first-of-type{border-top:0}
.nw .tag{font-size:12px;font-weight:700;color:var(--mut)}
.nw .tag.g{color:var(--up)} .nw .tag.r{color:var(--dn)} .nw .tag.y{color:var(--acc)}
.nw h4{margin:2px 0 4px;font-size:17px;line-height:1.35}
.nw p{margin:0;font-size:14px;color:var(--mut)}

.alloc{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--s2);margin:8px 0 10px}
.alloc i{display:block;height:100%;background:var(--c)}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px}
.lg span{display:flex;justify-content:space-between;gap:6px}
.lg span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);align-self:center;flex:none}
.lg span em{font-style:normal;margin-right:auto;margin-left:2px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0} .kv b{font-weight:700;text-align:right}

.ov{position:fixed;inset:0;background:rgba(5,8,12,.72);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{width:100%;max-width:520px;background:var(--s1);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:rise .28s ease-out}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .hd{font-weight:900;font-size:14px;color:var(--acc)}
.sheet .tk{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;color:var(--c);margin:4px 0}
.sheet .pop{font-size:44px;font-weight:800;display:inline-block;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.rw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.rw div{background:var(--s2);border-radius:12px;padding:10px 4px;text-align:center}
.rw b{display:block;font-size:17px;font-weight:800} .rw span{font-size:11px;color:var(--mut)}

/* ---- planner parts ---- */
.dnav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin:8px 0 10px}
.nb{height:44px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:20px}
.dcur{text-align:center;line-height:1.3}
.dcur b{font-family:'Bricolage Grotesque','Noto Sans KR',sans-serif;font-size:24px;font-weight:800}
.dcur .d2{display:block;font-size:12px;color:var(--mut)}
.tag2{font-style:normal;font-size:11px;font-weight:700;background:var(--acc);color:var(--acc-ink);border-radius:6px;padding:1px 6px;margin-left:5px}
.jump{display:block;margin:0 auto 10px;font-size:13px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:99px;padding:6px 14px}
.prog{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:8px}
.prog .row b{color:var(--ink);font-size:15px}
.bar{height:8px;border-radius:99px;background:var(--s2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--acc));border-radius:99px}
.slot{display:grid;grid-template-columns:50px 1fr;gap:10px;margin:0 0 8px}
.tm{font-size:12px;color:var(--mut);line-height:1.3;padding-top:11px;text-align:right}
.tm b{display:block;color:var(--ink);font-size:13px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.slot.fixed .card{background:transparent;border-style:dashed;padding:6px 12px;font-size:13px;color:var(--mut)}
.slot.fixed .tm{padding-top:6px}
.slot.now .card{border-color:var(--acc);border-width:2px;padding:8px 11px;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.slot.fixed.now .card{color:var(--ink)}
.sh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-bottom:2px}
.sh b{color:var(--ink);font-size:14px}
.now-b{font-size:11px;font-weight:900;background:var(--acc);color:var(--acc-ink);border-radius:6px;padding:1px 7px;margin-left:6px}
.free{font-size:13px;color:var(--mut);padding:6px 0 2px}
.task{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);color:var(--c)}
.task.nogo{grid-template-columns:28px 1fr auto}
.sh + .task{border-top:0}
.tx{font-weight:500;font-size:14px;color:var(--ink)}
.mvb{display:inline-block;font-style:normal;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;font-weight:400}
.chk{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--c);position:relative}
.task.done .chk{background:var(--c)}
.task.done .chk::after{content:"";position:absolute;left:8px;top:2px;width:6px;height:12px;border:solid var(--s1);border-width:0 3px 3px 0;transform:rotate(45deg)}
.task.done .tx{text-decoration:line-through;opacity:.45}
.go{width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
.ss{appearance:none;-webkit-appearance:none;font-size:12px;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 8px;min-height:30px;max-width:78px}
.moved-note{font-size:12px;color:var(--mut);margin:6px 2px 0}
.sbar{display:grid;grid-template-columns:62px 1fr 56px;gap:10px;align-items:center;margin:8px 0;font-size:14px;color:var(--c);font-weight:700}
.sbar span:last-child{text-align:right;color:var(--mut);font-weight:400;font-size:12px}
.wk{display:grid;grid-template-columns:84px 1fr 42px;gap:10px;align-items:center;margin:8px 0;font-size:13px;color:var(--mut)}
.wk span:last-child{text-align:right;color:var(--ink);font-weight:700}
.rep p{margin:4px 0;font-size:14px}
.rep .g{color:var(--ok);font-weight:700} .rep .b{color:var(--up);font-weight:700}
.wkh{font-size:12px;color:var(--mut);margin:14px 2px 6px}
.pdy{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:6px}
.pdy.today{border-color:var(--acc);border-width:2px;padding:8px 11px}
.pdy .dt{font-weight:700;font-size:14px;line-height:1.2}
.pdy .dt small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dots i{width:11px;height:11px;border-radius:3px;border:2px solid var(--c)}
.dots i.on{background:var(--c)}
.pdy .fr{font-size:12px;color:var(--mut)}
.od .dh2{font-size:12px;color:var(--mut);margin:8px 0 0}
.step{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:10px}
.step button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px}
.step b{min-width:22px;text-align:center;font-size:16px}
.pv{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.pv:first-of-type{border-top:0}
.pv b{font-weight:700}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .full{grid-column:1/-1}
.sc{display:grid;grid-template-columns:1fr auto 30px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.sc:first-child{border-top:0}
.sc small{display:block;color:var(--mut);font-size:11px}
.sc .gr{font-size:12px;color:var(--mut);margin-right:6px}
.sc .x{font-size:20px;color:var(--mut);width:30px;height:30px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs div.in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11px;color:var(--mut)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="true"] svg{stroke:var(--acc)}
nav.tabs .nbd{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;border-radius:99px;background:var(--up);color:#fff;font-size:10px;font-weight:900;line-height:16px;padding:0 4px;text-align:center}

/* ---- competition ---- */
.rvc{display:block;width:100%;text-align:left}
.rvc .rk{font-family:'Bricolage Grotesque','Noto Sans KR',sans-serif;font-weight:800;font-size:17px}
.rvc .rr{font-size:13px;color:var(--mut);margin-top:8px}
.vsg{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vsg .side b{display:block;font-size:26px;font-weight:800;line-height:1.15}
.vsg .side span{font-size:12px;color:var(--mut)}
.vsg .mid{font-size:12px;font-weight:900;color:var(--acc);background:var(--s2);border-radius:99px;padding:4px 10px}
.live .lh{font-size:12px;font-weight:900;color:var(--acc);margin-bottom:8px}
.live .st{text-align:center;font-weight:900;font-size:15px;margin-top:10px}
.cmp{display:grid;grid-template-columns:1fr 78px 1fr;gap:6px;font-size:14px;padding:8px 0;border-top:1px solid var(--line);text-align:center;align-items:center}
.cmp:first-of-type{border-top:0}
.cmp .k{font-size:12px;color:var(--mut)}
.cmp b{font-weight:800}
.msg{font-size:15px;font-weight:700;line-height:1.5;margin:4px 0 2px}
.ladder{display:flex;flex-direction:column;gap:6px}
.lad{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--s1);font-size:14px}
.lad .nm{font-family:'Bricolage Grotesque','Noto Sans KR',sans-serif;font-weight:800}
.lad.me{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.lad.lock{opacity:.45}
.lad small{color:var(--mut);font-size:12px}
.xps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.xps div{background:var(--s2);border-radius:12px;padding:10px 12px}
.xps b{display:block;font-size:18px;font-weight:800}
.xps span{font-size:12px;color:var(--mut)}
.ttl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ttl div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--s1)}
.ttl div.off{opacity:.4}
.ttl b{display:block;font-family:'Bricolage Grotesque','Noto Sans KR',sans-serif;font-size:13px;font-weight:800}
.ttl span{font-size:12px;color:var(--mut)}
.ck{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.ck:first-of-type{border-top:0}
.ck i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.ck.ok i{background:var(--ok);border-color:var(--ok)}
.ck span:last-child{font-size:12px;color:var(--mut)}
.alert{background:var(--s2);border-left:3px solid var(--acc);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
nav.tabs div.in{grid-template-columns:repeat(6,1fr)}

  const mAll   = tasks.filter(t=>t.subj==='m');
  const hAll   = tasks.filter(t=>t.subj==='h');
  const rAll   = tasks.filter(t=>t.subj==='r');
  const iAll = tasks.filter(t=>t.subj==='i');
  const wdy = parseKey(dateKey).getDay(); const weekend = (wdy===0||wdy===6);

  kAll.slice(0,kFirst).forEach(t=>out[t.id]='p0');
  vocab.forEach(t=>out[t.id]='p1');
  eOther.forEach(t=>out[t.id]='p1');
  rAll.forEach(t=>out[t.id]='p1');
  jaisto.forEach(t=>out[t.id]='p2');
  sAll.forEach(t=>out[t.id]='p3');
  lAll.forEach(t=>out[t.id]='p4');
  hAll.forEach(t=>out[t.id]='p4');

  const mSlots=['p5','p6','p7','p8'];
  mAll.forEach((t,i)=>out[t.id]=mSlots[Math.min(i,mSlots.length-1)]);

  const kRest = kAll.slice(kFirst);
  const pSlots = weekend ? ['p9','p10','p11','p12'] : ['p9','p10','p11','p12','p13'];
  if(kRest.length){
    const n=pSlots.length, base=Math.floor(kRest.length/n), extra=kRest.length%n;
    let idx=0;
    for(let i=0;i<n;i++){
      const cnt=base+(i<extra?1:0);
      for(let j=0;j<cnt && idx<kRest.length;j++,idx++) out[kRest[idx].id]=pSlots[i];
    }
  }
  iAll.forEach(t=>out[t.id]='p13');
  review.forEach(t=>out[t.id]='wrap');
  if(gbg.length){
    const ord=['p0','p1','p2','p3','p4','p5','p6','p7','p8','p9','p10','p11','p12','p13'];
    const used=new Set(Object.values(out));
    const cross=(a,b)=>(a==='p4'&&b==='p5')||(a==='p8'&&b==='p9');
    const pairs=[];
    for(let i=0;i<ord.length-1;i++) if(!used.has(ord[i])&&!used.has(ord[i+1])) pairs.push([ord[i],ord[i+1]]);
    const good=pairs.filter(p=>!cross(p[0],p[1]));
    const pick=(good.length?good:pairs)[0]||['p12','p13'];
    gbg.forEach((t,i)=>out[t.id]=pick[Math.min(i,1)]);
  }
  return out;
}

  Object.keys(g).forEach(k=>{
    h+=`<div class="dh2">${k} (${DOW[parseKey(k).getDay()]})</div>`;
    g[k].forEach(t=>{const d=!!S.done[t.id]; h+=`<div class="task nogo ${d?'done':''}" style="--c:var(--c-${t.subj});grid-template-columns:28px 1fr">
      <button class="chk" data-a="chk" data-id="${t.id}" aria-pressed="${d}" aria-label="${esc(t.text)} 했음 체크"></button><div class="tx">${esc(t.text)}</div></div>`;});
  });
  h+=`</div><div class="box"><h3>어떻게 다시 배치할까요</h3>
    <div class="seg"><button data-a="mode" data-v="spread" aria-pressed="${S.mode==='spread'}">남은 날에 나눠서</button><button data-a="mode" data-v="reserve" aria-pressed="${S.mode==='reserve'}">예비일 11/13~15에 몰아서</button></div>`;
  if(S.mode==='spread') h+=`<div class="step"><span>하루에 최대</span><button data-a="pd" data-v="-1" aria-label="줄이기">-</button><b>${S.perDay}</b><button data-a="pd" data-v="1" aria-label="늘리기">+</button><span>개 추가</span></div>`;
  const plan=planResched(od);
  if(!plan) h+=`<p class="note">남은 날짜가 없어서 옮길 수 없어요.</p>`;
  else{
    const by={}; plan.moves.forEach(m=>{(by[m.to]=by[m.to]||[]).push(m.t);});
    h+=`<div>`+Object.keys(by).map(k=>`<div class="pv"><b>${k} ${DOW[parseKey(k).getDay()]}</b><span>${by[k].map(t=>esc(t.text)).join(' · ')}</span></div>`).join('')+`</div>`;
    if(plan.over) h+=`<p class="err">하루 ${S.perDay}개로는 ${plan.over}개가 남아서 마지막 3일에 더 얹었어요. 개수를 늘리거나 우선순위를 정해서 빼는 것도 방법이에요.</p>`;
    h+=`<button class="cta" data-a="apply">이대로 적용하기</button>`;
  }
  h+=`</div>`;
  if(hasMoved) h+=`<button class="cta ghost" data-a="undo">옮긴 분량 원래 날짜로 되돌리기</button>`;
  return h;
}
function viewScore(){
  const list=S.scores.filter(x=>x.subj===sf.subj), n=list.length;
  const eng=sf.subj==='r'||sf.subj==='e';
  let h=`<h2>모의고사 점수</h2><div class="box"><div class="form">
    <div class="full"><select class="in" id="sfsubj" aria-label="과목">${Object.keys(SUBJ).filter(k=>k!=='i').map(k=>`<option value="${k}" ${k===sf.subj?'selected':''}>${SUBJ[k].n}</option>`).join('')}</select></div>
    <input class="in" id="sflabel" placeholder="${defLabel(sf.subj,n+1)}" value="${esc(sf.label)}" aria-label="회차 이름">
    <input class="in" id="sfscore" type="number" inputmode="decimal" min="0" max="100" placeholder="점수 (0~100)" value="${esc(sf.score)}" aria-label="점수">
    <div class="full"><button class="cta sm" style="margin-top:0" data-a="addscore">점수 추가</button>${sf.err?`<div class="err">${sf.err}</div>`:''}</div></div></div>`;
  if(!n) return h+`<div class="empty">${SUBJ[sf.subj].n} 점수를 입력하면 추이 그래프가 나와요.</div>`;
  h+=`<div class="box"><h3>${SUBJ[sf.subj].n} 추이</h3>${chart(list,sf.subj)}</div><div class="box">`;
  list.forEach(e=>{h+=`<div class="sc"><span>${esc(e.label)}<small>${e.date} 입력</small></span><span>${eng?`<span class="gr">${eg(e.score)}등급</span>`:''}<b class="num">${e.score}</b></span><button class="x" data-a="delscore" data-id="${e.id}" aria-label="${esc(e.label)} 삭제">×</button></div>`;});
  return h+`</div>`;
}
function viewSet(){
  const stLabel={idle:'대기 중',syncing:'동기화 중…',ok:'방금 동기화됨',error:'동기화 실패 · 인터넷 확인'}[syncStatus]||'';
  let h=`<h2>설정</h2><div class="box"><h3>기기 간 동기화</h3>`;
  if(!syncCode){
    if(syncUI.join) h+=`<input class="in" id="joincode" placeholder="다른 기기에서 받은 코드 붙여넣기" value="${esc(syncUI.input)}"><button class="cta half ghost" data-a="joincancel">취소</button><button class="cta half" data-a="joinsubmit">연결</button>`;
    else h+=`<p class="note">여러 기기에서 쓰려면 동기화를 켜세요. 플래너 체크와 투자 기록이 같이 동기화돼요.</p><button class="cta half" data-a="syncstart">이 기기에서 동기화 시작</button><button class="cta half ghost" data-a="joinopen">코드 입력</button>`;
  }else{
    h+=`<p class="note">동기화 코드 <b>${esc(syncCode)}</b> · ${stLabel}</p><button class="cta half ghost" data-a="synccopy">코드 복사</button><button class="cta half ghost" data-a="syncpull">지금 새로고침</button><button class="cta half ghost" data-a="syncoff">해제</button>`;
  }
  h+=`</div><div class="box"><h3>투자 데이터</h3><p class="note">투자 기록 ${S.ex.sessions.length}건 · 총 XP ${xpBase().total} · Lv.${xpBase().lv.n}</p>
  <div class="fld"><label>하루 목표 공부 시간 (시간)</label><input class="nm2 num" id="tgt" type="number" inputmode="decimal" min="1" max="16" step="0.5" value="${S.ex.target/60}"></div>
  ${S.ex.sessions.length===0?`<button class="cta half ghost" data-a="demo">샘플 데이터 넣기</button>`:''}
  ${S.ex.sessions.some(s=>s.demo)?`<button class="cta half ghost" data-a="clearDemo">샘플 데이터 지우기</button>`:''}
  <button class="cta half ghost" data-a="reset">투자 기록만 초기화</button></div>`;
  return h;
}

/* ============ 렌더 ============ */
function render(){
  EFF=buildEff();
  try{ if(checkEvents()) save(); }catch(e){}
  const root=document.getElementById('app');
  let h;
  if(tab==='market'&&detail) h=vDetail();
  else h={home:vHome,today:vToday,study:vStudy,market:vMarketTab,rival:vRivalTab,plan:vPlanTab}[tab]();
  root.innerHTML=h; renderTabs();
  document.getElementById('ovl').innerHTML=reward?vReward():'';
  if(T&&tab==='study'&&!fin) tickClock();
  if(firstScroll&&tab==='today'){firstScroll=false; const el=document.querySelector('.slot.now'); if(el) el.scrollIntoView({block:'center'});}
}

/* ============ 동작 ============ */
function openFin(extra){fin=Object.assign({sub:dr.sub,label:dr.label,min:25,focus:90,manual:false,task:null},extra);render();}
function saveSession(){
  const m0=market(); const px0=m0.out[fin.sub].price, v0=m0.nowVal, inv0=m0.nowInv, x0=xpBase().total, lv0=xpBase().lv.n;
  const min=clamp(Math.round(+fin.min||0),1,600);
  const ses={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),day:todayKey(),sub:fin.sub,min,focus:clamp(+fin.focus||0,0,100),label:fin.label||'',plan:fin.task?1:0};
  S.ex.sessions.push(ses); MEMO=null;
  if(fin.task) S.done[fin.task]=1;
  checkEvents(); save();
  const m1=market(), X=xpBase(); const px1=m1.out[fin.sub].price;
  reward={sub:fin.sub,min,px0,px1,dPx:px1/px0-1,gain:m1.nowVal-v0-(m1.nowInv-inv0),xp:X.total-x0,lv:X.lv.n,lvUp:X.lv.n>lv0,left:X.lv.need-X.lv.cur};
  fin=null; T=null; saveTimer(); dr.label=''; dr.task=null; tab='study'; render();
}
function demoData(){
  let seed=7; const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const t=todayKey(); S.ex.sessions=S.ex.sessions.filter(s=>!s.demo);
  for(let k=14;k>=1;k--){const d=addDays(t,-k);
    SUBS.forEach(s=>{
      let p=.75; if(s.id==='e'&&k<=3) p=0; if(s.id==='h') p=.35; if(s.id==='m') p=.95;
      if(rnd()>p) return;
      const min=Math.round((25+rnd()*50)/5)*5, focus=Math.round((70+rnd()*28)/5)*5;
      S.ex.sessions.push({id:'d'+d+s.id,day:d,sub:s.id,min,focus,label:'',demo:true});
    });}
  save(); render();
}
function clearDemo(){S.ex.sessions=S.ex.sessions.filter(s=>!s.demo); save(); render();}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el||el.tagName==='SELECT') return;
  if(el.dataset.a==='closeReward'&&e.target.closest('[data-stop]')&&!e.target.closest('button')) return;
  const a=el.dataset.a, v=el.dataset.v, id=el.dataset.id, y=window.scrollY;
  switch(a){
    case 'tab': tab=v; detail=null; render(); window.scrollTo(0,0); break;
    case 'msub': mSub=v; detail=null; render(); window.scrollTo(0,0); break;
    case 'rsub': rSub=v; render(); window.scrollTo(0,0); break;
    case 'goRank': tab='rival'; rSub='rank'; render(); window.scrollTo(0,0); break;
    case 'startMatch': {const rs=rankState(); if(S.ex.match) break; if(rs.eligible) S.ex.match={type:'promo',from:rs.rk,start:todayKey()}; else if(atRisk()) S.ex.match={type:'defense',from:rs.rk,start:todayKey()}; save(); render(); break;}
    case 'psub': pSub=v; render(); window.scrollTo(0,0); break;
    case 'open': detail=v; range='1W'; tab='market'; mSub='market'; render(); window.scrollTo(0,0); break;
    case 'back': detail=null; render(); window.scrollTo(0,0); break;
    case 'mf': mf=v; render(); break;
    case 'range': range=v; render(); break;
    case 'invest': dr.sub=v; dr.task=null; dr.label=''; detail=null; tab='study'; render(); window.scrollTo(0,0); break;
    case 'inv': {const t=ALL.find(x=>x.id===id); if(t){dr.sub=PLAN2SUB[t.subj]; dr.label=t.text; dr.task=t.id; detail=null; tab='study'; render(); window.scrollTo(0,0);} break;}
    case 'sub': dr.sub=v; dr.task=null; render(); break;
    case 'task': {const pk=planToday(); const x=(pk?EFF[pk]:[]).filter(z=>PLAN2SUB[z.subj]===dr.sub)[+v]; if(x){dr.task=dr.task===x.id?null:x.id; dr.label=dr.task?x.text:'';} render(); break;}
    case 'preset': dr.mode=el.dataset.m; if(dr.mode==='down') dr.dur=+el.dataset.d; render(); break;
    case 'start': T={sub:dr.sub,label:dr.label,mode:dr.mode,dur:dr.dur,task:dr.task,startAt:Date.now()}; saveTimer(); render(); break;
    case 'cancel': if(confirm('이 투자를 기록하지 않고 취소할까요?')){T=null;saveTimer();render();} break;
    case 'stop': {let min=Math.max(1,Math.round(elapsedMs()/60000)); if(T.mode==='down') min=Math.max(1,Math.min(T.dur,min)); openFin({sub:T.sub,label:T.label,min,task:T.task}); break;}
    case 'manual': openFin({sub:dr.sub,label:dr.label,min:30,manual:true,task:dr.task}); break;
    case 'cancelFin': fin=null; render(); break;
    case 'save': saveSession(); break;
    case 'closeReward': reward=null; render(); break;
    case 'demo': demoData(); break;
    case 'clearDemo': clearDemo(); break;
    case 'reset': if(confirm('투자 기록과 랭크를 모두 지울까요? 플래너 체크는 그대로 남아요.')){S.ex=Object.assign(EXDEF(),{target:S.ex.target});save();render();} break;
    case 'chk': if(S.done[id]) delete S.done[id]; else S.done[id]=1; save(); render(); window.scrollTo(0,y); break;
    case 'day': {const i=DAYS.findIndex(d=>d.key===view)+Number(v); if(i>=0&&i<DAYS.length){view=DAYS[i].key; render(); window.scrollTo(0,0);} break;}
    case 'go': view=v; tab='today'; render(); window.scrollTo(0,0); break;
    case 'todayjump': view=defaultView(); render(); window.scrollTo(0,0); break;
    case 'mode': S.mode=v; save(); render(); window.scrollTo(0,y); break;
    case 'pd': S.perDay=Math.min(6,Math.max(1,S.perDay+Number(v))); save(); render(); window.scrollTo(0,y); break;
    case 'apply': {const p=planResched(overdueList()); if(p){p.moves.forEach(m=>{S.moved[m.t.id]=m.to;}); save(); render(); window.scrollTo(0,0);} break;}
    case 'undo': S.moved={}; save(); render(); window.scrollTo(0,y); break;
    case 'addscore': {
      const sc=parseFloat(sf.score);
      if(isNaN(sc)||sc<0||sc>100){sf.err='0에서 100 사이 점수를 입력하세요.'; render(); return;}
      const n=S.scores.filter(x=>x.subj===sf.subj).length;
      S.scores.push({id:Date.now(),subj:sf.subj,label:(sf.label||'').trim()||defLabel(sf.subj,n+1),score:sc,date:keyOf(realToday())});
      sf.score='';sf.label='';sf.err=''; save(); render(); break;}
    case 'delscore': S.scores=S.scores.filter(x=>String(x.id)!==id); save(); render(); window.scrollTo(0,y); break;
    case 'syncstart': kvStart(); break;
    case 'joinopen': syncUI.join=true; syncUI.input=''; render(); break;
    case 'joincancel': syncUI.join=false; render(); break;
    case 'joinsubmit': {const code=(syncUI.input||'').trim(); if(!code) return;
      syncCode=code; try{localStorage.setItem(SYNC_KEY,code);}catch(e2){}
      syncUI.join=false; syncStatus='idle'; render(); kvPull(false).then(startRealtime); break;}
    case 'syncpull': kvPull(false); break;
    case 'syncoff': syncOff(); break;
    case 'synccopy': if(syncCode){try{navigator.clipboard.writeText(syncCode);}catch(e2){}} render(); break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target, y=window.scrollY;
  if(t.dataset&&t.dataset.a==='slot'){S.assign[t.dataset.id]=t.value; save(); render(); window.scrollTo(0,y);}
  else if(t.id==='sfsubj'){sf.subj=t.value; sf.err=''; render();}
  else if(t.id==='tgt'){const hh=parseFloat(t.value); if(hh>=1&&hh<=16){S.ex.target=Math.round(hh*60); save(); render();}}
});
document.addEventListener('input',e=>{
  const t=e.target, k=t.dataset&&t.dataset.i;
  if(t.id==='sflabel') sf.label=t.value;
  if(t.id==='sfscore') sf.score=t.value;
  if(t.id==='joincode') syncUI.input=t.value;
  if(!k) return;
  if(k==='label'){dr.label=t.value; dr.task=null; return;}
  if(!fin) return; fin[k]=(t.type==='range'||t.type==='number')?+t.value:t.value;
  if(k==='focus'){const o=document.getElementById('o_focus'); if(o) o.textContent=fin.focus+'%';}
  if(k==='acc'){const o=document.getElementById('o_acc'); if(o) o.textContent=fin.acc+'%';}
  if(k==='q'){const r=document.getElementById('accRow'); if(r) r.classList.toggle('off',!(fin.q>0));}
});
setInterval(()=>{if(T&&tab==='study'&&!fin) tickClock(); else if(tab==='rival'&&rSub==='duel'){const lv=document.getElementById('live'); if(lv) lv.innerHTML=vLive();}},1000);

render();
if(syncCode) kvPull(true).then(startRealtime);
</script>
</body>
