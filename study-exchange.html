#app{display:flex;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#nav{width:96px;flex:none;background:var(--acc);display:flex;flex-direction:column;gap:8px;padding:14px 10px}
#nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0;border-radius:14px;color:#aeb8c8;font-size:14px;font-weight:600}
#nav button b{font-size:22px;font-weight:400}
#nav button[aria-pressed=true]{background:#fff;color:var(--acc)}
#main{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px 16px 12px}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 4px 8px}
.hd .l{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mut);font-weight:600}
.hd .l button{border:1px solid var(--line);background:var(--s1);border-radius:10px;padding:5px 12px;font-size:15px;color:var(--ink)}
.hd .l .dt{min-width:84px;text-align:center}
.hd .c{text-align:center;line-height:1}
.hd .c b{display:block;font-size:clamp(44px,9vh,84px);font-weight:900;color:var(--acc);letter-spacing:-2px}
.hd .c span{font-size:12px;color:var(--mut)}
.hd .r{text-align:right;font-size:13px;color:var(--mut)}.hd .r b{font-size:20px;color:var(--ink)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.col{display:flex;flex-direction:column;gap:6px;min-height:0}
.slot{flex:1 1 0;min-height:0;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:6px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.slot.now{border:2px solid var(--acc);padding:5px 9px}
.slot h4{font-size:12px;color:var(--mut);font-weight:700;display:flex;gap:6px;align-items:baseline}.slot h4 small{font-weight:400;font-size:11px}
.slot.empty{background:transparent;border-style:dashed;opacity:.6}
.fx{flex:none;text-align:center;font-size:11px;color:var(--mut);background:var(--s2);border-radius:8px;padding:2px}
.it{display:flex;gap:8px;align-items:flex-start;font-size:clamp(12px,1.9vh,16px);line-height:1.3;font-weight:600;color:var(--c);padding:2px 0;cursor:pointer;word-break:keep-all}
.it i{flex:none;width:1.2em;height:1.2em;margin-top:.05em;border:2px solid var(--c);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.8em}
.it.done{opacity:.4;text-decoration:line-through}.it.done i{background:var(--c);color:#fff}.it.done i::after{content:'✓'}
.pb{flex:none;display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:700}
.bar{height:10px;border-radius:99px;background:var(--s2);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.flag{background:var(--acc);color:#fff;border-radius:6px;font-size:10px;padding:1px 6px;font-weight:700}
.wk{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:6px 7px;overflow:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.wd.today{border:2px solid var(--acc);padding:5px 6px}.wd.we{background:var(--s2)}
.wd h5{font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:4px;cursor:pointer;margin-bottom:2px}.wd h5 small{color:var(--mut);font-weight:400}
.wd .sl{font-size:10px;color:var(--mut);margin-top:3px}
.wd .it{font-size:11.5px;gap:5px}
.mwrap{flex:1;min-height:0;overflow:auto}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);min-width:760px}
.mh{text-align:center;font-size:12px;font-weight:700;background:var(--acc);color:#fff;padding:4px 0}
.mc{display:flex;flex-direction:column;gap:2px;background:var(--s1);border:1px solid var(--line);padding:4px 5px;cursor:pointer;min-height:88px}
.mc.we{background:var(--s2)}.mc.out{opacity:.4}.mc.today{outline:2px solid var(--acc);outline-offset:-2px}.mc.full{background:#e3f4e8}
.mc .mt{display:flex;gap:4px;align-items:baseline}.mc .mt i{font-style:normal;font-size:10px;color:var(--mut);margin-left:auto}
.mc .dn{font-size:13px}.dn.sun,.dn.sat{color:var(--up)}.mh.sun,.mh.sat{color:#ffc9cf}
.mc .mcnt{font-size:9px;color:var(--mut)}
.mc .it{font-size:10.5px;gap:3px;padding:0}.mc .it i{display:none}.mc .it.done::before{content:'✓ ';text-decoration:none}
.chips{display:flex;gap:6px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--s1);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--mut)}
.chip[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.pg{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-content:start}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{font-size:15px;margin-bottom:10px}
.big{font-size:40px;font-weight:900;color:var(--acc)}
.sb{display:grid;grid-template-columns:76px 1fr 74px;gap:10px;align-items:center;margin:8px 0;font-size:14px;font-weight:600}
.sb .bar i{background:var(--c)}.sb span:first-child{color:var(--c)}.sb span:last-child{text-align:right;color:var(--mut);font-size:13px}
.ml{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mut);margin-bottom:6px}.ml span{display:flex;gap:4px;align-items:center}.ml i{width:8px;height:8px;border-radius:50%;background:var(--c)}
@media (max-width:860px),(orientation:portrait){
 #app{flex-direction:column}#nav{width:auto;flex-direction:row;padding:8px;justify-content:space-around}#nav button{flex:1;flex-direction:row;justify-content:center;padding:8px}
 html,body{overflow:auto}#app{height:auto;min-height:100dvh}.cols,.pg{grid-template-columns:1fr}.wk{grid-template-columns:1fr}.body{min-height:70vh}
}

  g.forEach(t=>{const n=(/그불구 (\d+)강/.exec(t.text)||[])[1]||'0';(byN[n]=byN[n]||[]).push(t);});
  const groups=Object.keys(byN).map(Number).sort((a,b)=>a-b).map(n=>byN[n].sort((a,b)=>(/과제/.test(a.text)?1:0)-(/과제/.test(b.text)?1:0)));
  const PAIRS=[['p1','p2'],['p3','p4'],['p5','p6'],['p7','p8']];
  const pairsOf=k=>PAIRS.filter(p=>p.every(x=>avail[k].has(x)));
  const gw=live.map((k,i)=>Math.min(i===0?1:3,pairsOf(k).length));
  let gLast=-1;
  (()=>{const res=live.map(()=>[]);let gi=0;gw.forEach((c,di)=>{for(let j=0;j<c&&gi<groups.length;j++) res[di].push(groups[gi++]);}); while(gi<groups.length) res[res.length-1].push(groups[gi++]); return res;})().forEach((arr,di)=>{const k=live[di]; const P=pairsOf(k); arr.forEach((grp,j)=>{gLast=Math.max(gLast,di); const pr=P[j%Math.max(1,P.length)]||['p7','p8']; grp.forEach(t=>put(t,k,/과제/.test(t.text)?pr[1]:pr[0]));});});
  // 자이스토리: 그불구가 끝난 날부터
  const jl=['p2','p6'];
  line(Q.filter(t=>t.subj==='e'&&t.text.startsWith('자이스토리')&&inR(t)).sort(ordr),jl,(k,i)=>i>=Math.max(0,gLast)?LN(k,jl).length:0);
  // 영단어: 밀린 곳부터 하루 1건(=3일차)씩 순서대로
  const vocab=Q.filter(t=>t.subj==='e'&&t.text.startsWith('영단어')&&t.text!=='영단어 복습').sort(ordr);
  const vd=DAYS.filter(d=>d.date>=t0).map(d=>d.key);
  vocab.forEach((t,i)=>{const k=vd[Math.min(i,vd.length-1)]; const a=avail[k]; put(t,k,(a&&a.size)?(a.has('p1')?'p1':[...a][0]):'p1');});
  S.built=3;
}
if(S.built!==3){build(); save(false);}
const applyHide=()=>{ALL=ALL0.filter(t=>!S.hide[t.id]);}; applyHide();

/* ---------- 날짜별 계획 ---------- */
const kOf=t=>(S.plan[t.id]&&KEYSET.has(S.plan[t.id].d))?S.plan[t.id].d:t.orig;
const AUTO={m:['p5','p6','p7','p8'],k:['p0','p9','p10','p11','p12','p13'],s:['p3'],l:['p4'],h:['p4'],r:['p1'],i:['p13']};
let EFF={};
function buildEff(){
  const by={}; DAYS.forEach(d=>by[d.key]=[]); ALL.forEach(t=>by[kOf(t)].push(t));
  const out={};
  DAYS.forEach(d=>{
    const items=by[d.key], slotOf={}, rest={};
    items.forEach(t=>{ if(S.plan[t.id]&&kOf(t)===S.plan[t.id].d) slotOf[t.id]=S.plan[t.id].s; else (rest[t.subj]=rest[t.subj]||[]).push(t);});

      let lanes=AUTO[sj]||['p1']; const wd=parseKey(d.key).getDay(); if(sj==='k'&&(wd===0||wd===6)) lanes=lanes.filter(x=>x!=='p13');

    });
    const arr=items.map(t=>({t,s:slotOf[t.id]||'p1'})).sort((a,b)=>SIDX[a.s]-SIDX[b.s]||ALL0.indexOf(a.t)-ALL0.indexOf(b.t));
    out[d.key]={list:arr.map(x=>x.t),slot:slotOf};
  });
  EFF=out;
}
const doneN=l=>l.filter(t=>S.done[t.id]).length;

/* ---------- 화면 ---------- */
let tab='today', cur=defaultDay(), wkStart=null, mp=null;
function defaultDay(){const t=realToday(); if(t<START) return DAYS[0].key; const L=DAYS[DAYS.length-1].date; return t>L?DAYS[DAYS.length-1].key:keyOf(t);}
const isToday=k=>parseKey(k).getTime()===realToday().getTime();
const mon=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const item=t=>`<div class="it ${S.done[t.id]?'done':''}" data-a="chk" data-id="${esc(t.id)}" style="--c:var(--c-${t.subj})"><i></i><span>${esc(t.text)}</span></div>`;
function hdr(left){
  const all=ALL, dn=doneN(all);
  return `<div class="hd"><div class="l">${left||''}</div><div class="c"><b>D-${dday(keyOf(realToday()))}</b><span>수능 11/19</span></div><div class="r">전체 진행률<br><b>${Math.round(dn/all.length*100)}%</b> <span>${dn}/${all.length}</span><br><span id="syncst" style="font-size:11px">${syncSt}</span></div></div>`;
}
function vToday(){
  const k=cur, d=DAYS.find(x=>x.key===k), e=EFF[k], dt=parseKey(k), nm=nowMin(), tod=isToday(k);
  const bySlot={}; e.list.forEach(t=>{const s=e.slot[t.id]; (bySlot[s]=bySlot[s]||[]).push(t);});
  const slot=sl=>{const l=bySlot[sl.id]||[]; const now=tod&&nm>=sl.s&&nm<sl.e;
    return `<div class="slot ${now?'now':''} ${l.length?'':'empty'}" style="flex-grow:${Math.max(1,l.length)+.4}"><h4>${sl.label}<small>${fmt(sl.s)}–${fmt(sl.e)}</small></h4>${l.map(item).join('')}</div>`;};
  const S_=id=>SLOTS.find(s=>s.id===id);
  const am=['p0','p1','p2','p3','p4'].map(i=>slot(S_(i))).join('')+`<div class="fx">점심 12:30–13:00</div>`;
  const pm=['p5','p6','p7','p8'].map(i=>slot(S_(i))).join('')+`<div class="fx">저녁 17:30–18:00</div>`;
  const ev=['p9','p10','p11','p12','p13','wrap'].map(i=>slot(S_(i))).join('');
  const dn=doneN(e.list), p=e.list.length?Math.round(dn/e.list.length*100):0, fl=FLAG[k]||(RESERVE.includes(k)?'예비일':'');
  const left=`<button data-a="day" data-v="-1">◀</button><span class="dt">${k} (${DOW[dt.getDay()]})</span><button data-a="day" data-v="1">▶</button>${tod?'':`<button data-a="gotoday">오늘</button>`}${fl?`<span class="flag">${fl}</span>`:''}`;
  return hdr(left)+`<div class="body"><div class="cols"><div class="col">${am}</div><div class="col">${pm}</div><div class="col">${ev}</div></div>
   <div class="pb"><span>${tod?'오늘':k} 진행</span><div class="bar"><i style="width:${p}%"></i></div><span>${dn}/${e.list.length} · ${p}%</span></div></div>`;
}
function vWeek(){
  if(!wkStart) wkStart=mon(parseKey(cur));
  const ws=wkStart, we=addD(ws,6);
  let h=hdr(`<button data-a="wk" data-v="-1">◀</button><span class="dt">${keyOf(ws)} ~ ${keyOf(we)}</span><button data-a="wk" data-v="1">▶</button>`)+`<div class="body"><div class="wk">`;
  for(let i=0;i<7;i++){const dd=addD(ws,i),k=keyOf(dd),e=EFF[k],dw=dd.getDay();
    if(!e){h+=`<div class="wd"><h5>${k} (${DOW[dw]})</h5></div>`;continue;}
    let last='',inner=''; e.list.forEach(t=>{const s=e.slot[t.id]; if(s!==last){last=s; const sl=SLOTS.find(x=>x.id===s); inner+=`<div class="sl">${sl.label} ${fmt(sl.s)}</div>`;} inner+=item(t);});
    h+=`<div class="wd ${isToday(k)?'today':''} ${dw===0||dw===6?'we':''}"><h5 data-a="go" data-v="${k}"><b>${k} (${DOW[dw]})</b><small>${doneN(e.list)}/${e.list.length}</small></h5>${inner}</div>`;}
  return h+`</div></div>`;
}
function vMonth(){
  const w0=mon(DAYS[0].date), nW=Math.ceil((mon(DAYS[DAYS.length-1].date)-w0)/864e5/7)+1, per=4, nP=Math.ceil(nW/per);
  if(mp==null) mp=Math.max(0,Math.min(nP-1,Math.floor(Math.round((mon(realToday())-w0)/864e5/7)/per)));
  const ws=addD(w0,mp*per*7), we=addD(ws,Math.min(per,nW-mp*per)*7-1), circ='①②③④⑤⑥⑦⑧⑨';
  let tot=0,dn=0; DAYS.forEach(d=>{if(d.date<ws||d.date>we)return; const l=EFF[d.key].list; tot+=l.length; dn+=doneN(l);});
  let h=hdr(`<span class="dt" style="min-width:0">${keyOf(ws)} ~ ${keyOf(we)}</span>`)+`<div class="body"><div class="chips">${Array.from({length:nP},(_,i)=>`<button class="chip" data-a="mp" data-v="${i}" aria-pressed="${i===mp}">계획표 ${circ[i]}</button>`).join('')}<span style="margin-left:8px;font-size:13px;color:var(--mut);align-self:center">달성 ${tot?Math.round(dn/tot*100):0}% · ${dn}/${tot}</span></div>
  <div class="ml">${Object.keys(SUBJ).map(s=>`<span style="--c:var(--c-${s})"><i></i>${SUBJ[s]}</span>`).join('')}</div><div class="mwrap"><div class="mcal"><div class="mh">월</div><div class="mh">화</div><div class="mh">수</div><div class="mh">목</div><div class="mh">금</div><div class="mh sat">토</div><div class="mh sun">일</div>`;
  for(let i=0;i<per*7;i++){const d=addD(ws,i); if(d>we)break; const k=keyOf(d), e=EFF[k], dow=d.getDay();
    if(!e){h+=`<div class="mc out"><span class="mt"><b class="dn">${k}</b></span></div>`;continue;}
    const dd=doneN(e.list), fl=FLAG[k]||(RESERVE.includes(k)?'예비일':'');
    h+=`<div class="mc ${dow===0||dow===6?'we':''} ${isToday(k)?'today':''} ${e.list.length&&dd===e.list.length?'full':''}" data-a="go" data-v="${k}"><span class="mt"><b class="dn ${dow===0?'sun':dow===6?'sat':''}">${k}</b>${fl?`<span class="flag">${fl}</span>`:''}<i>D-${dday(k)}</i></span><span class="mcnt">${dd}/${e.list.length}</span>${e.list.map(item).join('')}</div>`;}
  return h+`</div></div></div>`;
}
function vProg(){
  const bar=(c,d,t)=>`<div class="sb" style="--c:var(${c})"><span>${''}</span><div class="bar"><i style="width:${t?d/t*100:0}%"></i></div><span>${d}/${t}</span></div>`;
  const E=parseKey(E_KEY), first=ALL.filter(t=>parseKey(kOf(t))<=E), all=ALL;
  const st={}; Object.keys(SUBJ).forEach(s=>st[s]={t:0,d:0,t1:0,d1:0});
  all.forEach(t=>{st[t.subj].t++; if(S.done[t.id]) st[t.subj].d++;});
  first.forEach(t=>{st[t.subj].t1++; if(S.done[t.id]) st[t.subj].d1++;});
  const row=(s,d,t)=>`<div class="sb" style="--c:var(--c-${s})"><span>${SUBJ[s]}</span><div class="bar"><i style="width:${t?d/t*100:0}%"></i></div><span>${d}/${t}</span></div>`;
  const dn=doneN(all), d1=doneN(first), t0=realToday(), ws=mon(t0), wl=[];
  for(let i=0;i<7;i++){const k=keyOf(addD(ws,i)); if(EFF[k]) wl.push(...EFF[k].list);}
  const tk=keyOf(t0), tl=EFF[tk]?EFF[tk].list:[];
  const pc=(d,t)=>t?Math.round(d/t*100):0;
  return hdr('')+`<div class="body"><div class="pg">
  <div class="card"><h3>전체 진행률</h3><div class="big">${pc(dn,all.length)}%</div><div class="bar" style="margin:8px 0"><i style="width:${pc(dn,all.length)}%"></i></div><span style="color:var(--mut);font-size:13px">${dn}/${all.length}</span></div>
  <div class="card"><h3>10/14 1차 마감 (남은 분량 ${first.length-d1}개)</h3><div class="big">${pc(d1,first.length)}%</div><div class="bar" style="margin:8px 0"><i style="width:${pc(d1,first.length)}%"></i></div><span style="color:var(--mut);font-size:13px">${d1}/${first.length}</span></div>
  <div class="card"><h3>오늘</h3><div class="big">${pc(doneN(tl),tl.length)}%</div><div class="bar" style="margin:8px 0"><i style="width:${pc(doneN(tl),tl.length)}%"></i></div><span style="color:var(--mut);font-size:13px">${doneN(tl)}/${tl.length}</span></div>
  <div class="card"><h3>이번 주</h3><div class="big">${pc(doneN(wl),wl.length)}%</div><div class="bar" style="margin:8px 0"><i style="width:${pc(doneN(wl),wl.length)}%"></i></div><span style="color:var(--mut);font-size:13px">${doneN(wl)}/${wl.length}</span></div>
  <div class="card"><h3>과목별 (전체)</h3>${Object.keys(SUBJ).filter(s=>st[s].t).map(s=>row(s,st[s].d,st[s].t)).join('')}</div>
  <div class="card"><h3>과목별 (10/14까지)</h3>${Object.keys(SUBJ).filter(s=>st[s].t1).map(s=>row(s,st[s].d1,st[s].t1)).join('')}</div></div></div>`;
}
const TABS=[['today','오늘','◉'],['week','주간','▦'],['month','월간','▤'],['prog','진행률','◐']];
function render(){
  buildEff();
  document.getElementById('nav').innerHTML=TABS.map(([k,n,ic])=>`<button data-a="tab" data-v="${k}" aria-pressed="${tab===k}"><b>${ic}</b>${n}</button>`).join('');
  document.getElementById('main').innerHTML={today:vToday,week:vWeek,month:vMonth,prog:vProg}[tab]();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a, v=el.dataset.v, y=window.scrollY;
  const keep=document.querySelector('.mwrap,.wk,.cols,.pg'); 
  switch(a){
    case 'tab': tab=v; break;
    case 'chk': {const id=el.dataset.id; if(S.done[id]){delete S.done[id]; S.un[id]=Date.now();} else {S.done[id]=Date.now(); delete S.un[id];} save(); break;}
    case 'day': {const i=DAYS.findIndex(d=>d.key===cur)+ +v; if(i>=0&&i<DAYS.length) cur=DAYS[i].key; break;}
    case 'gotoday': cur=defaultDay(); break;
    case 'go': cur=v; tab='today'; break;
    case 'wk': wkStart=addD(wkStart,7*+v); break;
    case 'mp': mp=+v; break;
  }
  const sc=[...document.querySelectorAll('.slot,.wd,.mwrap,.pg')].map(x=>x.scrollTop);
  render(); window.scrollTo(0,y);
  if(a==='chk') [...document.querySelectorAll('.slot,.wd,.mwrap,.pg')].forEach((x,i)=>{if(sc[i]!=null) x.scrollTop=sc[i];});
});
setInterval(()=>{if(tab==='today'&&isToday(cur)){const sc=[...document.querySelectorAll('.slot')].map(x=>x.scrollTop); render(); [...document.querySelectorAll('.slot')].forEach((x,i)=>x.scrollTop=sc[i]||0);}},60000);

let fbp=null, syncSt='연결 중', pushT=null, unsub=null;
async function loadFB(){ if(fbp) return fbp; try{
  const A=await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js"), F=await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js");

function mergeIn(c){

async function startSync(){

    const snap=await fbp.F.getDoc(fbp.ref);

    save(false); render(); await push();
    unsub=fbp.F.onSnapshot(fbp.ref,s=>{ if(!s.exists()||s.metadata.hasPendingWrites) return; const before=JSON.stringify([S.done,S.un,S.built]); mergeIn(s.data()); if(JSON.stringify([S.done,S.un,S.built])!==before){save(false); render(); push();} setSt('☁ 동기화됨'); });
