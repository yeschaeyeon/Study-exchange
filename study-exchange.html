:root{--bg:#e8ebf1;--s1:#fff;--s2:#f3f5f9;--line:#b9c2d0;--ink:#0b1220;--mut:#4d586b;--acc:#0b1b3a;--acc-ink:#fff;--ok:#157a3c;--up:#c0132a;
--c-m:#1f5eea;--c-k:#d1202f;--c-e:#14903f;--c-s:#e8590c;--c-l:#0a8f86;--c-h:#8a4b1f;--c-r:#7d2ae8;--c-i:#d6247f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Chosun","Apple SD Gothic Neo",serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{display:flex;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#nav{width:92px;flex:none;background:var(--acc);display:flex;flex-direction:column;gap:6px;padding:14px 10px}
#nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:13px 0;border-radius:12px;color:#b4bfd3;font-size:14px;font-weight:700}
#nav button b{font-size:21px;font-weight:400}
#nav button[aria-pressed=true]{background:#fff;color:var(--acc)}
#main{flex:1;min-width:0;display:flex;flex-direction:column;padding:10px 14px 12px}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 4px 8px}
.hd .l{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mut);font-weight:700}
.hd .l button{border:1.5px solid var(--acc);background:var(--s1);border-radius:10px;padding:5px 12px;font-size:15px;color:var(--acc);font-weight:700}
.hd .l .dt{min-width:84px;text-align:center;color:var(--ink)}
.hd .c{text-align:center;line-height:1}
.hd .c b{display:block;font-size:clamp(40px,8vh,76px);font-weight:700;color:var(--acc);letter-spacing:-1px}
.hd .c span{font-size:12px;color:var(--mut)}
.hd .r{text-align:right;font-size:13px;color:var(--mut)}.hd .r b{font-size:20px;color:var(--ink)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.days{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dc{display:flex;flex-direction:column;min-height:0;border:2px solid var(--acc);border-radius:14px;background:var(--s1);overflow:hidden}
.dh{flex:none;display:flex;align-items:baseline;gap:8px;padding:8px 12px;background:var(--acc);color:#fff}
.dh b{font-size:19px}.dh span{font-size:12px;opacity:.85}.dh em{font-style:normal;margin-left:auto;font-size:13px;font-weight:700}
.dh .flag{background:#fff;color:var(--acc);border-radius:5px;font-size:10px;padding:1px 6px;font-weight:700}
.dc.today .dh::after{content:'TODAY';font-size:10px;background:#fff;color:var(--acc);border-radius:5px;padding:1px 6px;font-weight:700;order:-1}
.dbar{flex:none;height:5px;background:#cfd6e2}.dbar i{display:block;height:100%;background:#f5b800}
.dsc{flex:1;min-height:0;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;background:var(--s2)}
.slot{flex:none;border:1.5px solid var(--ink);border-radius:11px;background:var(--s1);overflow:hidden}
.nd{display:inline-block;width:11px;height:11px;border-radius:50%;background:#f5b800;align-self:center;box-shadow:0 0 0 2px rgba(245,184,0,.35)}
.slot.now{border-color:#f5b800;box-shadow:0 0 0 3px #f5b800}
.tp{display:inline-block;margin-top:3px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
.tp.idle{display:none}.tp.over{background:#000;color:var(--bg)}
.tm{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:14px 40px 36px;text-align:center}
.tm.over{background:#000;animation:ob .7s 2}
.tmode{display:flex;gap:8px;flex:none}
.tmode button{font-family:inherit;font-size:15px;font-weight:700;border:2px solid var(--acc);background:transparent;color:var(--acc);border-radius:20px;padding:5px 16px;cursor:pointer}
.tmode button.on{background:var(--acc);color:#fff}
.tbig{flex:1;display:flex;align-items:center;justify-content:center;width:100%;font-size:min(19vw,34vh);line-height:1;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap;user-select:none}
.tm.over .tbig{color:var(--bg)}
.tpre{display:flex;gap:8px;flex:none;margin-bottom:14px}
.tpre button{font-family:inherit;font-size:14px;font-weight:700;border:2px solid var(--acc);background:transparent;color:var(--acc);border-radius:16px;padding:4px 12px;cursor:pointer}
.tpre button.on{background:var(--acc);color:#fff}
.trow{flex:none;width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.tc{font-family:inherit;width:112px;height:112px;border-radius:50%;border:3px solid var(--acc);background:transparent;color:var(--acc);font-size:21px;font-weight:700;cursor:pointer;flex:none}
.tc.g{background:var(--acc);color:#fff}.tc.y{background:#f5b800;border-color:#f5b800;color:var(--acc)}.tc.d{opacity:.3;pointer-events:none}.tc.v{visibility:hidden}
.tm.over .tc{border-color:var(--bg);color:var(--bg)}.tm.over .tmode button{border-color:var(--bg);color:var(--bg)}.tm.over .tmode button.on{background:var(--bg);color:#000}
.laps{flex:1;min-width:0;max-height:25vh;overflow:auto;font-variant-numeric:tabular-nums;font-size:16px;color:var(--acc);text-align:left}
.laps div{display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px 4px;border-top:1px solid var(--line)}.laps div.h{color:var(--mut);font-size:13px}.laps div span+span{text-align:center}.laps div span:last-child{text-align:right}
@keyframes bl{50%{opacity:.35}}@keyframes ob{50%{background:var(--bg)}}
.slot h4{display:flex;gap:8px;align-items:baseline;padding:4px 10px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:700}.slot h4 small{font-weight:400;font-size:11px;opacity:.85}
.slot .its{display:flex;flex-direction:column;gap:5px;padding:6px}
.fx{flex:none;text-align:center;font-size:11px;color:var(--mut);padding:0}
.it{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:14.5px;line-height:1.32;font-weight:700;color:var(--ink);padding:7px 9px 7px 11px;cursor:pointer;word-break:keep-all;background:var(--s1);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:8px}
.it .ck{flex:none;width:21px;height:21px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.it.done{background:#dfe4ec;color:var(--mut);text-decoration:line-through;border-color:#c3cbd8;border-left-color:var(--c)}
.it.done .ck{background:var(--ink);border-color:var(--ink);color:#fff}.it.done .ck::after{content:'✓'}
.pb{flex:none;display:flex;align-items:center;gap:12px;background:var(--s1);border:1.5px solid var(--acc);border-radius:12px;padding:7px 14px;font-size:14px;font-weight:700}
.bar{height:10px;border-radius:99px;background:#cfd6e2;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.flag{background:var(--acc);color:#fff;border-radius:6px;font-size:10px;padding:1px 6px;font-weight:700}
.wk{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--s1);border:1.5px solid var(--ink);border-radius:12px;padding:5px;overflow:auto;display:flex;flex-direction:column;gap:4px;min-height:0}
.wd.today{box-shadow:0 0 0 3px var(--acc)}.wd.we{background:var(--s2)}

    let best=-1, bv=1e9; for(let j=I15+1;j<=LAST;j++){ if(hasR[j]&&hasR[j+1]) continue; const v=(cnt[j]||0)+(cnt[j+1]||0); if(v<=bv){bv=v;best=j;} }
    if(best>=0) mv.forEach(o=>{ if(o.i>best) o.i--; });
  }
  mv.forEach(o=>{ S.plan[o.t.id]={d:ext[Math.min(o.i,LAST)],s:o.s}; });
  S.sh=2; save(false); }
const payload=()=>JSON.parse(JSON.stringify({done:S.done,un:S.un,plan:S.plan,hide:S.hide,built:S.built,sh:S.sh||0,_rev:S._rev}));
function setSt(s){syncSt=s; const el=document.getElementById('syncst'); if(el) el.textContent=s;}
function pushSoon(){clearTimeout(pushT); pushT=setTimeout(push,700);}
async function push(){ try{ if(!await loadFB()) throw 0; setSt('저장 중'); await fbp.F.setDoc(fbp.ref,payload()); setSt('☁ 저장됨'); }catch(e){setSt('오프라인(기기에만 저장)');} }
async function startSync(){
  try{ if(!await loadFB()) throw 0;
    const snap=await fbp.F.getDoc(fbp.ref);
    if(snap.exists()) mergeIn(snap.data());
    migrate(); save(false); render(); await push();
    unsub=fbp.F.onSnapshot(fbp.ref,s=>{ if(!s.exists()||s.metadata.hasPendingWrites) return; const cmp=()=>JSON.stringify([S.done,S.un,S.built,S.sh,S.plan]); const before=cmp(); mergeIn(s.data()); if(cmp()!==before){save(false); render(); push();} setSt('☁ 동기화됨'); });
  }catch(e){setSt('오프라인(기기에만 저장)'); try{migrate(); render();}catch(x){}}
}
render(); tick();
startSync();
</script></body></html>
