:root{--bg:#fff;--ink:#111111;--mut:#7d828b;--line:#d9dbe0;--faint:#f3f4f6;--err:#c0392b;
--pg:#7fe98d;--py:#fbe24d;--pp:#f4a6ef;--pb:#5fb6f2;--pt:#6ee7c8;--po:#ffa94d;--pz:#d9dbe0;
--c-m:var(--pb);--c-k:var(--pp);--c-e:var(--pg);--c-s:var(--po);--c-l:var(--py);--c-h:var(--pt);--c-r:var(--pg);--c-i:var(--pz);--c-x:var(--pz)}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0;box-shadow:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#fff;color:var(--ink);font-family:"Chosun","Apple SD Gothic Neo",serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(54px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
#main{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 14px 12px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1.5px solid var(--ink);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);z-index:10}
#nav button{flex:1;height:54px;font-size:16px;font-weight:700;color:var(--ink);background:#fff}
#nav button+button{border-left:1px solid var(--line)}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 4px 8px;flex:none}
.hd .l{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mut)}
.hd .l button{border:1.5px solid var(--ink);background:#fff;padding:5px 12px;font-size:15px;color:var(--ink);font-weight:700}
.hd .l .dt{min-width:84px;text-align:center;color:var(--ink);font-weight:700}
.hd .c{text-align:center;line-height:1}
.hd .c b{display:block;font-size:clamp(40px,8vh,76px);font-weight:700;color:var(--ink);letter-spacing:-1px}
.hd .c span{font-size:12px;color:var(--mut)}
.hd .r{text-align:right;font-size:13px;color:var(--mut)}.hd .r b{font-size:20px;color:var(--ink)}
.body{flex:1;min-height:0;display:flex;flex-direction:column}
.hl{display:inline;padding:3px 6px;line-height:1.5;background:var(--hc);color:var(--ink);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tp{display:inline-block;margin-top:3px;font-size:12px;font-weight:700;padding:1px 8px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.tp.idle{display:none}.tp.over{color:var(--err);border-color:var(--err)}
/* 주간 */
.wk{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{background:#fff;border:1.5px solid var(--ink);overflow:auto;display:flex;flex-direction:column;min-height:0}

.wd h5{flex:none;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:4px;padding:6px 7px;background:#111111;color:#fff}
.wd h5 small{color:#fff;font-weight:400}
.wd .sl{flex:none;font-size:10.5px;padding:6px 7px 3px;border-top:1px solid var(--line)}
.wd .sl span{display:inline-block;background:var(--ink);color:#fff;padding:1px 8px;line-height:1.5}
.wd h5+.sl{border-top:0}
.it{display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:14px;line-height:1.5;color:var(--ink);padding:6px 7px;border-top:1px solid var(--line);cursor:pointer;word-break:keep-all}
.wd .sl+.it{border-top:0}
.wd .it{font-size:11.5px;padding:4px 6px 4px 1px}
.tx{flex:1;min-width:0;padding:0 6px}
.ck{flex:none;width:16px;height:16px;border:1.5px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;line-height:1}
.wd .it .ck{width:14px;height:14px;font-size:9px}
.it.done .ck::after{content:'✓'}
html.v1 .it.done{background:var(--faint)}html.v1 .it.done .ck{background:var(--hc);color:var(--ink)}
/* 타이머 */
.tm{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:14px 40px 36px;text-align:center}
.tmode{display:flex;gap:8px;flex:none}
.tmode button,.tpre button{font-family:inherit;font-size:15px;font-weight:700;border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:6px 16px;cursor:pointer}
.tmode button.on,.tpre button.on{background:var(--ink);color:#fff}
.tpre{display:flex;gap:8px;flex:none;margin-bottom:14px}.tpre button{font-size:14px;padding:5px 12px}
.tbig{flex:1;display:flex;align-items:center;justify-content:center;width:100%;font-size:min(19vw,34vh);line-height:1;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;user-select:none}
.tm.over .tbig{color:var(--err)}
.trow{flex:none;width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.tc{font-family:inherit;width:112px;height:112px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-size:21px;font-weight:700;cursor:pointer;flex:none;display:grid;place-items:center}
.tc.d{opacity:.3;pointer-events:none}.tc.v{visibility:hidden}
.laps{flex:1;min-width:0;max-height:25vh;overflow:auto;font-variant-numeric:tabular-nums;font-size:16px;color:var(--ink);text-align:left}
.laps div{display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px 4px;border-top:1px solid var(--line)}.laps div.h{color:var(--mut);font-size:13px;border-top:0}.laps div span+span{text-align:center}.laps div span:last-child{text-align:right}
/* 시계 */
.cw{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:10px}
.ac{width:min(64vh,86vw);aspect-ratio:1;flex:none}.ac svg{width:100%;height:100%;display:block}
.cl{font-size:min(3.8vh,5vw);color:var(--ink);text-align:center}.cs{font-size:min(2.8vh,4vw);color:var(--mut);text-align:center}
@media (max-width:860px),(orientation:portrait){
 html,body{overflow:auto}#app{height:auto;min-height:100dvh}.wk{grid-template-columns:1fr}.body{min-height:70vh}
}

function tAct(a,v){const n=Date.now(), t=T.t, w=T.w;
  switch(a){
    case 'tmode': T.mode=v; break;

    case 'tstart': t.st='run'; t.end=n+T.dur*1000; break;
    case 'tpause': t.rem=Math.max(0,t.end-n); t.st='pause'; break;
    case 'tresume': t.end=n+t.rem; t.st='run'; break;
    case 'tstop': t.st='idle'; break;
    case 'wstart': w.base=n-w.el; w.st='run'; break;

function mergeIn(c){

  const ids=new Set([...Object.keys(S.done),...Object.keys(U),...Object.keys(CD),...Object.keys(CU)]), nd={}, nu={};

function migrate(){ /* 1회성: 10/9부터 한국사 제외 하루씩 뒤로 + 10/15~11/15 조정(11/15 종료) */
  if((S.sh||0)>=2) return;
  buildEff(); const ext=DAYS.map(d=>d.key); if(!ext.includes('11/16')) ext.push('11/16');
  const ix=k=>ext.indexOf(k), I9=ix('10/9'), I15=ix('10/15'), LAST=ix('11/15');
  const effK=t=>{const p=S.plan[t.id]; return (p&&ext.includes(p.d))?p.d:t.orig;};
  const mv=ALL.filter(t=>t.subj!=='h'&&!S.done[t.id]).map(t=>{const k=effK(t), p=S.plan[t.id]; return {t,i:ix(k),s:(p&&p.s)||(EFF[k]&&EFF[k].slot[t.id])||'p1'};});
  mv.forEach(o=>{ if((S.sh||0)===0?o.i>=I9:o.i===I9) o.i++; });
  if(mv.some(o=>o.i>LAST)){
    const cnt={}, hasR={}; mv.forEach(o=>{ if(o.i>=I15){cnt[o.i]=(cnt[o.i]||0)+1; if(o.t.subj==='r') hasR[o.i]=1;} });
    let best=-1, bv=1e9; for(let j=I15+1;j<=LAST;j++){ if(hasR[j]&&hasR[j+1]) continue; const v=(cnt[j]||0)+(cnt[j+1]||0); if(v<=bv){bv=v;best=j;} }
    if(best>=0) mv.forEach(o=>{ if(o.i>best) o.i--; });
  }
  mv.forEach(o=>{ S.plan[o.t.id]={d:ext[Math.min(o.i,LAST)],s:o.s}; });
  S.sh=2; save(false); }
function migrate3(){ /* 사문: 십지선다 7차시~ 하루 5차시 → 오답체크 → 시크릿 모고+오답체크 → 이후 시리즈 이어서 */

  const n1=t=>+((t.text.match(/(\d+)/)||[0,0])[1]), cnt=t=>{const m=t.text.match(/(\d+)~(\d+)차시/); return m?m[2]-m[1]+1:1;};
  const isS=t=>t.subj==='s', put=(t,i)=>{S.plan[t.id]={d:DAYS[Math.min(i,DAYS.length-1)].key,s:'p3'};};
  ALL0.filter(t=>isS(t)&&t.text.startsWith('사문 십지선다')&&!t.text.includes('오답')&&!S.done[t.id]&&n1(t)<7).forEach(t=>{S.hide[t.id]=1;});
  applyHide();
  const rem=ALL.filter(t=>isS(t)&&t.text.startsWith('사문 십지선다')&&!t.text.includes('오답')&&!S.done[t.id]).sort((a,b)=>n1(a)-n1(b));
  let i=s0, used=0, last=s0; rem.forEach(t=>{const c=cnt(t); if(used+c>5){i++;used=0;} used+=c; put(t,i); last=i;});
  const od=ALL.filter(t=>isS(t)&&t.text.includes('십지선다 오답체크')&&!S.done[t.id]).sort((a,b)=>ALL0.indexOf(a)-ALL0.indexOf(b));
  od.forEach((t,j)=>put(t,last+j));
  let day=last+Math.max(od.length-1,0)+1;
  const sec=ALL.filter(t=>isS(t)&&t.text.startsWith('사문 시크릿')&&!S.done[t.id]).sort((a,b)=>ALL0.indexOf(a)-ALL0.indexOf(b));
  sec.forEach(t=>put(t,day));
  let prev=day;
  ALL.filter(t=>isS(t)&&/^사문 (하트모|적중예감)/.test(t.text)&&!S.done[t.id]).sort((a,b)=>ALL0.indexOf(a)-ALL0.indexOf(b)).forEach(t=>{prev++; put(t,prev);});
  S.sh=4; save(false); }
